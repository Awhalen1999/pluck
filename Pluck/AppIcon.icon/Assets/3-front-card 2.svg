<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="fw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F3F7"/></linearGradient>
<!-- pink rises across the left edge of the back card (x=368), blurred like frosted glass -->
<linearGradient id="tintX" gradientUnits="userSpaceOnUse" x1="310" y1="0" x2="687" y2="0">
<stop offset="0" stop-color="#FF6E9C" stop-opacity="0"/>
<stop offset=".35" stop-color="#FF6E9C" stop-opacity=".45"/>
<stop offset="1" stop-color="#F0145A" stop-opacity=".7"/>
</linearGradient>
<!-- and fades out past the back card's bottom edge (y=705) -->
<linearGradient id="fadeY" gradientUnits="userSpaceOnUse" x1="0" y1="334" x2="0" y2="769">
<stop offset="0" stop-color="#fff"/>
<stop offset=".7" stop-color="#fff"/>
<stop offset=".93" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="m"><rect x="150" y="334" width="537" height="435" fill="url(#fadeY)"/></mask>
</defs>
<rect x="150" y="334" width="537" height="435" rx="70" fill="url(#fw)" fill-opacity=".92"/>
<rect x="150" y="334" width="537" height="435" rx="70" fill="url(#tintX)" mask="url(#m)"/>
</svg>
